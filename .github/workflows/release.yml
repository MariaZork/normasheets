name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing, no API token needed
      contents: write   # attach files to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Build example PDF carousel for the release page
        run: |
          pip install -e .
          playwright install --with-deps chromium
          normasheets build examples/navier-stokes --formats pdf --strict
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            examples/navier-stokes/out/navier-stokes-series.pdf
