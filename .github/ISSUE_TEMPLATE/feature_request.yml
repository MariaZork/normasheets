name: Feature request
description: A new block, theme, export format or check
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What do you want to build
      description: Describe the cheat sheet and what is missing. A sketch or reference image helps.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Proposed YAML
      description: How would you like to write it?
      render: yaml
